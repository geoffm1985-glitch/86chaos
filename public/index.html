<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12161A" />
    <meta name="msapplication-TileColor" content="#12161A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="86 Chaos" />
    <meta name="description" content="86 Chaos restaurant and kitchen management app" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/86chaos-icon-16-v2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/86chaos-icon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/86chaos-icon-48-v2.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/86chaos-icon-180-v2.png" />
    <script>
      (function () {
        var testingHost = window.location.hostname === 'testing.86chaos.com';
        var experimentalHost = window.location.hostname === 'experimental.86chaos.com';
        var manifest = document.createElement('link');
        manifest.id = 'app-manifest';
        manifest.rel = 'manifest';
        if (testingHost) manifest.setAttribute('href', '/manifest-testing.json');
        else if (experimentalHost) manifest.setAttribute('href', '/manifest-experimental.json');
        else manifest.setAttribute('href', '%PUBLIC_URL%/manifest.json');
        document.head.appendChild(manifest);

        var installedName = experimentalHost ? '86chaos experimental' : (testingHost ? '86chaos testing' : '86 Chaos');
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute('content', installedName);
        document.title = installedName;
      }());
    </script>
    <title>86 Chaos</title>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {}
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run 86chaos.</noscript>
    <div id="root"></div>
  </body>
</html>
