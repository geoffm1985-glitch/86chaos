name: 86 Chaos Testing Limited Repair Gate

on:
  push:
    branches:
      - ci-play-store-testing-16-0-237

permissions:
  contents: read

concurrency:
  group: 86chaos-testing-limited-repair
  cancel-in-progress: true

jobs:
  testing-limited-gate:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      APP_URL: https://testing.86chaos.com
      CHAOS_BASE_URL: https://testing.86chaos.com
      PLAYWRIGHT_BASE_URL: https://testing.86chaos.com
      CHAOS_EXPECTED_BRANCH: testing
      CHAOS_EXPECTED_VERCEL_PROJECT_SLUG: 86chaos
      REACT_APP_FIREBASE_PROJECT_ID: chaos-test-d1601
      REACT_APP_TEST_FIREBASE_PROJECT_ID: chaos-test-d1601
    steps:
      - name: Check out current testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Capture exact testing identity
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $branch = (git rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'testing') { throw "Expected testing branch, got $branch" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "CHAOS_EXPECTED_GIT_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAOS_EXPECTED_VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Testing commit: $sha"
          "Testing version: $($pkg.version)"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked test dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund --progress=false

      - name: Run current source validator
        shell: pwsh
        run: npm run test:source

      - name: Run 2 alias classifier Node tests
        shell: pwsh
        run: node --test --test-name-pattern="known testing aliases|QA seed and full-audit helper" api/vercel-target-validation.test.cjs

      - name: Run 1 validator line-ending Node test
        shell: pwsh
        run: node --test api/source-validator-line-ending-safety.test.cjs

      - name: Calculate current source lines
        continue-on-error: true
        shell: pwsh
        run: node scripts/86chaos-release-gate/source-inventory.cjs

      - name: Wait for exact testing deployment
        shell: pwsh
        run: |
          $matched = $false
          for ($i = 0; $i -lt 120; $i++) {
            $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            try {
              $v = Invoke-RestMethod "$env:APP_URL/version.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
              $id = Invoke-RestMethod "$env:APP_URL/build-identity.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
              $commit = if ($id.gitCommit) { [string]$id.gitCommit } elseif ($id.commit) { [string]$id.commit } else { "" }
              if ([string]$v.version -eq $env:CHAOS_EXPECTED_VERSION -and $commit -eq $env:CHAOS_EXPECTED_GIT_COMMIT) {
                Write-Host "Exact testing deployment READY: version=$($v.version) commit=$commit"
                $matched = $true
                break
              }
              Write-Host "Waiting. Saw version=$($v.version) commit=$commit"
            } catch {
              Write-Host "Deployment not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $matched) { throw "Timed out waiting for exact testing deployment." }

      - name: Run 4 targeted Play Store test cases
        shell: pwsh
        run: .\node_modules\.bin\playwright.cmd test --config=playwright.play-store-release.config.cjs tests/86chaos-release-gate/38-release-identity-deployment-parity.spec.cjs tests/86chaos-release-gate/39-testing-alias-mutation-safety.spec.cjs tests/86chaos-release-gate/40-validator-line-ending-safety.spec.cjs --project=chromium

      - name: Upload limited validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-limited-repair-gate
          if-no-files-found: ignore
          retention-days: 30
          path: |
            test-results/**
            playwright-report/**
