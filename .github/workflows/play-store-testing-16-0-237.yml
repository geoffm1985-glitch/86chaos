name: 86 Chaos Targeted Validation - testing 16.0.243

on:
  push:
    branches:
      - ci-play-store-testing-16-0-237

permissions:
  contents: read

concurrency:
  group: 86chaos-testing-targeted-16-0-243
  cancel-in-progress: true

jobs:
  targeted-validation:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APP_URL: https://testing.86chaos.com
      CHAOS_BASE_URL: https://testing.86chaos.com
      PLAYWRIGHT_BASE_URL: https://testing.86chaos.com
      CHAOS_EXPECTED_GIT_COMMIT: c772217e285440766bb82537ae22783c3896af20
      CHAOS_EXPECTED_VERSION: 16.0.243
    steps:
      - name: Check out exact testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CHAOS_EXPECTED_GIT_COMMIT) { throw "Expected $env:CHAOS_EXPECTED_GIT_COMMIT but testing is $actual" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ([string]$pkg.version -ne $env:CHAOS_EXPECTED_VERSION) { throw "Expected version $env:CHAOS_EXPECTED_VERSION but package is $($pkg.version)" }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked test dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund --progress=false

      - name: Parse full release-gate PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\RUN_86CHAOS_PLAY_STORE_RELEASE_GATE.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "Release-gate PowerShell has parse errors." }

      - name: Run 16.0.243 source validator
        shell: pwsh
        run: node scripts/validate-16-0-243.js

      - name: Run QA credential bootstrap Node regression
        shell: pwsh
        run: node --test api/release-gate-auto-provision-role-env.test.cjs

      - name: Wait for exact deployed identity
        shell: pwsh
        run: |
          $matched = $false
          for ($i = 0; $i -lt 180; $i++) {
            $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            try {
              $v = Invoke-RestMethod "$env:APP_URL/version.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
              $id = Invoke-RestMethod "$env:APP_URL/build-identity.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
              $commit = if ($id.gitCommit) { [string]$id.gitCommit } elseif ($id.commit) { [string]$id.commit } else { "" }
              if ([string]$v.version -eq $env:CHAOS_EXPECTED_VERSION -and $commit -eq $env:CHAOS_EXPECTED_GIT_COMMIT) {
                Write-Host "Exact testing deployment verified: version=$($v.version) commit=$commit"
                $matched = $true
                break
              }
              Write-Host "Waiting. Saw version=$($v.version) commit=$commit"
            } catch {
              Write-Host "Deployment not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $matched) { throw "Timed out waiting for exact testing deployment." }

      - name: Run targeted Play Store release-gate regressions
        shell: pwsh
        run: .\node_modules\.bin\playwright.cmd test --config=playwright.inventory.config.cjs tests/86chaos-release-gate/39-testing-alias-mutation-safety.spec.cjs tests/86chaos-release-gate/40-validator-line-ending-safety.spec.cjs tests/86chaos-release-gate/41-auto-provision-role-env.spec.cjs --project=chromium

      - name: Upload targeted validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-16.0.243-targeted-validation
          if-no-files-found: ignore
          retention-days: 30
          path: |
            test-results/**
            playwright-report/**
