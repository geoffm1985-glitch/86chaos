name: 86 Chaos Testing Final Limited Gate

on:
  push:
    branches:
      - ci-play-store-testing-16-0-237

permissions:
  contents: read

concurrency:
  group: 86chaos-testing-final-limited-gate
  cancel-in-progress: true

jobs:
  final-targeted-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_URL: https://testing.86chaos.com
      CHAOS_BASE_URL: https://testing.86chaos.com
      PLAYWRIGHT_BASE_URL: https://testing.86chaos.com
      CHAOS_EXPECTED_GIT_COMMIT: 56acb89da0b7079af54fb3688c78e2adb5554558
      CHAOS_EXPECTED_VERSION: 16.0.242
    steps:
      - name: Check out exact testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CHAOS_EXPECTED_GIT_COMMIT) { throw "Expected $env:CHAOS_EXPECTED_GIT_COMMIT but testing is $actual" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ([string]$pkg.version -ne $env:CHAOS_EXPECTED_VERSION) { throw "Expected version $env:CHAOS_EXPECTED_VERSION but package is $($pkg.version)" }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked test dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund --progress=false

      - name: Verify exact deployed identity
        shell: pwsh
        run: |
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $v = Invoke-RestMethod "$env:APP_URL/version.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
          $id = Invoke-RestMethod "$env:APP_URL/build-identity.json?ci=$stamp" -Headers @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache" }
          $commit = if ($id.gitCommit) { [string]$id.gitCommit } elseif ($id.commit) { [string]$id.commit } else { "" }
          if ([string]$v.version -ne $env:CHAOS_EXPECTED_VERSION) { throw "Deployed version mismatch: $($v.version)" }
          if ($commit -ne $env:CHAOS_EXPECTED_GIT_COMMIT) { throw "Deployed commit mismatch: $commit" }
          Write-Host "Exact testing deployment verified."

      - name: Run exactly 4 targeted Play Store release-gate cases
        shell: pwsh
        run: .\node_modules\.bin\playwright.cmd test --config=playwright.inventory.config.cjs tests/86chaos-release-gate/38-release-identity-deployment-parity.spec.cjs tests/86chaos-release-gate/39-testing-alias-mutation-safety.spec.cjs tests/86chaos-release-gate/40-validator-line-ending-safety.spec.cjs --project=chromium

      - name: Upload final targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-16.0.242-final-targeted-gate
          if-no-files-found: ignore
          retention-days: 30
          path: |
            test-results/**
            playwright-report/**
