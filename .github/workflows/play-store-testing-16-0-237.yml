name: 86 Chaos Targeted Validation - testing 16.0.238

on:
  push:
    branches:
      - ci-play-store-testing-16-0-237

permissions:
  contents: read

jobs:
  targeted-testing:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CHAOS_EXPECTED_VERSION: 16.0.238
      CHAOS_EXPECTED_GIT_COMMIT: 30a7f8ad3e95722ce44c0fb6e0a93828d2a6fcac
      CHAOS_EXPECTED_BRANCH: testing
      REACT_APP_FIREBASE_PROJECT_ID: chaos-test-d1601
      REACT_APP_TEST_FIREBASE_PROJECT_ID: chaos-test-d1601
    steps:
      - name: Check out exact testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Verify exact testing commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CHAOS_EXPECTED_GIT_COMMIT) {
            throw "testing moved before targeted validation. Expected $env:CHAOS_EXPECTED_GIT_COMMIT but got $actual"
          }
          $branch = (git rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -ne 'testing') { throw "Expected local testing branch, got $branch" }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked test dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund --progress=false

      - name: Validate 16.0.238 source contract
        shell: pwsh
        run: node scripts/validate-16-0-238.js

      - name: Run alias safety Node regressions
        shell: pwsh
        run: node --test api/vercel-target-validation.test.cjs api/release-gate-workspace-safety.test.cjs

      - name: Run alias safety Play Store spec
        shell: pwsh
        run: .\node_modules\.bin\playwright.cmd test --config=playwright.play-store-release.config.cjs tests/86chaos-release-gate/39-testing-alias-mutation-safety.spec.cjs --project=chromium --project=mobile-chromium

      - name: Upload targeted validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-16.0.238-targeted-validation
          if-no-files-found: ignore
          retention-days: 30
          path: |
            test-results/**
            playwright-report/**
