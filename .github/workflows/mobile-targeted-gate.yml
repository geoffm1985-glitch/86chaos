name: Mobile Targeted Gate

on:
  push:
    branches:
      - mobile

permissions:
  contents: write

concurrency:
  group: mobile-targeted-gate
  cancel-in-progress: true

jobs:
  targeted:
    if: ${{ contains(github.event.head_commit.message, '[mobile-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      REACT_APP_FIREBASE_DEPLOYMENT_MODE: production
      REACT_APP_FIREBASE_ACTIVE_PROJECT_ID: cheers-34b8d
    steps:
      - name: Check out exact mobile commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Set up Java 21 for emulator tests and Android preview
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run current native targeted source tests
        run: |
          npm run test:current-release-targeted
          npm run test:mobile-capabilities

      - name: Verify authenticated native token repair with Firebase emulators
        run: npm run test:mobile-push-emulator

      - name: Build React assets
        env:
          CI: "false"
        run: npm run build

      - name: Verify Android and iOS Capacitor sync
        run: |
          npx cap sync android
          npx cap sync ios
          git diff --exit-code -- android ios capacitor.config.json package.json package-lock.json

      - name: Install Android Chromium and iPhone WebKit engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start local immutable mobile test server
        shell: bash
        run: |
          python3 -m http.server 3000 --directory build > /tmp/86chaos-mobile-http.log 2>&1 &
          echo $! > /tmp/86chaos-mobile-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/version.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/86chaos-mobile-http.log || true
          exit 1

      - name: Run Android and iPhone targeted Release Gate
        env:
          APP_URL: http://127.0.0.1:3000
          CHAOS_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:mobile-release-gate

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise real Android bridge, PDF document results and speech service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
            adb shell settings put secure location_mode 3
            adb emu geo fix -87.63 41.88
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.chiltonappworks.chaos86.NativeCapabilitiesTest

      - name: Require matching mobile backend before distributing APK
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent https://86chaos-git-mobile-cheers-portal-s-projects.vercel.app/api/mobile-capabilities > /tmp/86chaos-mobile-capabilities.json; then
              if node -e "const d=require('/tmp/86chaos-mobile-capabilities.json'); if(d.version!==require('./package.json').version || d.commit!==process.env.GITHUB_SHA || !d.productionCredentialsConfigured || d.projectId!=='cheers-34b8d')process.exit(1)"; then exit 0; fi
            fi
            sleep 10
          done
          echo "Matching mobile backend is not ready; withholding APK."
          exit 1

      - name: Restore persistent preview signing key
        if: ${{ contains(github.event.head_commit.message, '[android-preview]') }}
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.CHAOS_MOBILE_PREVIEW_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$PREVIEW_KEYSTORE_B64" || { echo "Missing retained preview signing key"; exit 1; }
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/86chaos-preview.keystore"
          test -s "$RUNNER_TEMP/86chaos-preview.keystore"
          echo "CHAOS_PREVIEW_KEYSTORE=$RUNNER_TEMP/86chaos-preview.keystore" >> "$GITHUB_ENV"

      - name: Build signed Android preview APK
        if: ${{ contains(github.event.head_commit.message, '[android-preview]') }}
        shell: bash
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          keytool -exportcert -keystore "$CHAOS_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/86chaos-preview-cert.der"
          preview_cert_hash=$(sha256sum "$RUNNER_TEMP/86chaos-preview-cert.der" | cut -d' ' -f1)
          apk_signer_tool=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          "$apk_signer_tool" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -F "$preview_cert_hash"
          python3 scripts/verify-native-push-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk 86Chaos-18.0.12-android-preview.apk
          sha256sum 86Chaos-18.0.12-android-preview.apk > 86Chaos-18.0.12-android-preview.apk.sha256

      - name: Publish Android preview release
        if: ${{ contains(github.event.head_commit.message, '[android-preview]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="mobile-v18.0.12-preview"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release already exists; refusing to replace its APK."; exit 1; fi
          gh release create "$tag" \
            86Chaos-18.0.12-android-preview.apk \
            86Chaos-18.0.12-android-preview.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "86 Chaos 18.0.12 Android Preview" \
            --prerelease \
            --notes "Internal Android preview for the 86 Chaos mobile branch. Includes testing 17.0.86 features, native PDF saving, printing, 86Voice, location and local reminders. Uses existing production accounts; changed API actions use the matching mobile branch backend. Preview signing is not the future Google Play production signing identity."

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-mobile-current-failure
          if-no-files-found: ignore
          retention-days: 3
          path: |
            test-results/**
            playwright-report/**
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
