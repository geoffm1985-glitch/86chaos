name: Testing Targeted Delta

on:
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-targeted-delta
  cancel-in-progress: false

jobs:
  targeted-delta:
    if: github.ref_name == 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact testing commit
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false

      - name: Run 17.0.35 targeted delta only
        run: npm run test:current-release-targeted
