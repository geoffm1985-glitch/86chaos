name: Prepare Firebase Admin 14 Lock

on:
  push:
    branches:
      - testing

permissions:
  contents: read

concurrency:
  group: prepare-firebase-admin-lock
  cancel-in-progress: true

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out testing
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate Firebase Admin 14.5 lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false --save-exact firebase-admin@14.5.0
          echo "LOCK_B64_BEGIN"
          gzip -9 -c package-lock.json | base64 -w 0
          echo
          echo "LOCK_B64_END"
