name: Testing Gate

on:
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-gate
  cancel-in-progress: false

jobs:
  targeted-delta:
    if: ${{ github.ref_name == 'testing' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[full-gate]') && !contains(github.event.head_commit.message, '[build-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: https://testing.86chaos.com
      CHAOS_BASE_URL: https://testing.86chaos.com
      PLAYWRIGHT_BASE_URL: https://testing.86chaos.com
      CHAOS_EXPECTED_BRANCH: testing
      CHAOS_EXPECTED_VERCEL_PROJECT_SLUG: 86chaos
      REACT_APP_TEST_FIREBASE_PROJECT_ID: chaos-test-d1601
      FIREBASE_TEST_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT_KEY }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
      SYSTEM_ADMIN_PASSWORD: ${{ secrets.SYSTEM_ADMIN_PASSWORD }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      MANAGER_EMAIL: ${{ secrets.MANAGER_EMAIL }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
      CHAOS_ALLOW_MUTATION: 'true'
      CHAOS_QA_CREATE_RESTAURANT: 'true'
    steps:
      - name: Check out exact testing commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Repair source manifest parity when needed
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const identity = require('./scripts/86chaos-release-gate/source-identity.cjs');
          const captured = identity.captureSourceIdentity(process.cwd());
          const manifest = { schemaVersion: 1, sourceHash: captured.sourceHash, files: captured.files };
          fs.writeFileSync('release-source-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          if git diff --quiet -- release-source-manifest.json; then
            echo "Source manifest already matches tracked source."
          else
            git config user.name "86 Chaos Gate Bot"
            git config user.email "actions@users.noreply.github.com"
            git add release-source-manifest.json
            git commit -m "ci: refresh 17.0.59 testing source manifest parity"
            git push origin HEAD:testing
            echo "Manifest repaired; the follow-up testing push will run targeted/delta against the exact repaired commit."
            exit 0
          fi
      - name: Run 17.0.59 targeted delta only
        run: npm run test:current-release-targeted
      - name: Capture exact targeted-delta identity
        shell: bash
        run: |
          echo "CHAOS_EXPECTED_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          version=$(node -p "require('./package.json').version")
          echo "CHAOS_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
      - name: Wait for exact testing deployment
        shell: bash
        run: |
          matched=false
          identity_file="$RUNNER_TEMP/86chaos-build-identity.json"
          version_file="$RUNNER_TEMP/86chaos-version.json"
          for attempt in $(seq 1 180); do
            if ! curl --fail --silent --show-error -o "$identity_file" "$APP_URL/build-identity.json?ci=$RANDOM"; then
              : > "$identity_file"
            fi
            if ! curl --fail --silent --show-error -o "$version_file" "$APP_URL/version.json?ci=$RANDOM"; then
              : > "$version_file"
            fi
            deployed_commit="$(node scripts/ci/read-deployment-identity.cjs commit "$identity_file")"
            deployed_version="$(node scripts/ci/read-deployment-identity.cjs version "$version_file")"
            if [ "$deployed_commit" = "$CHAOS_EXPECTED_GIT_COMMIT" ] && [ "$deployed_version" = "$CHAOS_EXPECTED_VERSION" ]; then
              matched=true
              break
            fi
            sleep 10
          done
          if [ "$matched" != true ]; then
            echo "Timed out waiting for exact targeted-delta deployment." >&2
            exit 1
          fi
      - name: Install targeted-delta browser
        run: npx playwright install --with-deps chromium
      - name: Run 17.0.69 repaired browser delta on desktop and mobile
        run: >-
          npx playwright test
          tests/86chaos-new-implementations/04-schedule-pdf-print.spec.cjs
          tests/86chaos-new-implementations/05-mobile-schedule-pdf-delivery.spec.cjs
          tests/86chaos-new-implementations/08-phase1-spanish-interface.spec.cjs
          tests/86chaos-release-gate/66-firebase-emulator-bridge-17-0-54.spec.cjs
          tests/86chaos-release-gate/67-firebase-emulator-cra-build-17-0-55.spec.cjs
          tests/86chaos-release-gate/68-firebase-emulator-entry-import-17-0-56.spec.cjs
          tests/86chaos-release-gate/69-yardmaster-firebase-bridge-17-0-57.spec.cjs
          tests/86chaos-release-gate/70-release-gate-emulator-target-coherence-17-0-58.spec.cjs
          tests/86chaos-release-gate/71-release-gate-staleness-manifest-17-0-59.spec.cjs
          tests/86chaos-release-gate/72-release-gate-source-inventory-17-0-60.spec.cjs
          tests/86chaos-release-gate/73-release-gate-ignored-local-source-17-0-61.spec.cjs
          tests/86chaos-release-gate/74-release-gate-root-source-archive-17-0-62.spec.cjs
          tests/86chaos-release-gate/75-yardmaster-readiness-bootstrap-17-0-63.spec.cjs
          tests/86chaos-release-gate/76-emulator-runtime-boundaries-17-0-64.spec.cjs
          tests/86chaos-release-gate/77-release-gate-lineage-title-migration-17-0-65.spec.cjs
          tests/86chaos-release-gate/78-release-gate-lineage-suite-prefix-17-0-66.spec.cjs
          tests/86chaos-release-gate/79-runtime-isolation-csp-sticky-a11y-17-0-67.spec.cjs
          tests/86chaos-release-gate/80-failed-new-evidence-17-0-68.spec.cjs
          tests/86chaos-release-gate/81-source-manifest-authority-17-0-69.spec.cjs
          tests/86chaos-release-gate/82-release-gate-hostile-fixture-manifest-17-0-70.spec.cjs
          tests/86chaos-release-gate/83-failed-only-manifest-emulator-target-17-0-71.spec.cjs
          tests/86chaos-release-gate/84-failed-only-manifest-reporter-independence-17-0-72.spec.cjs
          tests/e2e/runtime-isolation-csp-sticky-a11y.spec.cjs
          tests/e2e/failed-new-evidence-17-0-68.spec.cjs
          tests/e2e/source-manifest-authority-17-0-69.spec.cjs
          tests/e2e/release-gate-hostile-fixture-manifest-17-0-70.spec.cjs
          tests/e2e/failed-only-manifest-emulator-target-17-0-71.spec.cjs
          tests/e2e/failed-only-manifest-reporter-independence-17-0-72.spec.cjs
          tests/e2e/release-gate-lineage-title-migration.spec.cjs
          tests/86chaos-full-audit/05-schedule-builder-mutation.spec.cjs
          tests/86chaos-release-gate/35-reminder-notification-certification.spec.cjs
          tests/86chaos-release-gate/48-needs-attention-readiness-2.spec.cjs
          tests/86chaos-release-gate/49-restaurant-intelligence-review-boundaries.spec.cjs
          tests/86chaos-release-gate/50-purchase-reconciliation-browser.spec.cjs
          tests/86chaos-release-gate/51-security-cost-observability.spec.cjs
          tests/86chaos-release-gate/52-listener-route-cleanup.spec.cjs
          tests/86chaos-release-gate/53-reminder-voice-lifecycle.spec.cjs
          tests/86chaos-release-gate/54-emergency-schedule-requestoff.spec.cjs
          tests/86chaos-release-gate/55-full-surface-traceability.spec.cjs
          tests/86chaos-release-gate/56-manager-brief-sticky-day-header.spec.cjs
          tests/86chaos-release-gate/57-sticky-header-touch-handoff.spec.cjs
          tests/86chaos-release-gate/58-testing-gate-17-0-43.spec.cjs
          tests/86chaos-release-gate/60-customer-help-version-17-0-45.spec.cjs
          tests/86chaos-release-gate/61-release-gate-surgical-repairs-17-0-46.spec.cjs
          tests/86chaos-release-gate/63-testing-deployment-identity-file-reader-17-0-49.spec.cjs
          tests/86chaos-release-gate/64-system-admin-recovery-boundary-17-0-51.spec.cjs
          tests/86chaos-release-gate/65-system-admin-firebase-cost-runtime-17-0-52.spec.cjs
          tests/86chaos-full-audit/06-request-off-events-integration.spec.cjs
          tests/e2e/schedule-request-off-management.spec.cjs
          --config=playwright.play-store-release.config.cjs
          --project=chromium
          --project=mobile-chromium
      - name: Upload targeted-delta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-targeted-delta
          if-no-files-found: warn
          retention-days: 30
          path: test-results/**

  full-release-gate:
    if: ${{ github.ref_name == 'testing' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-gate]')) }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      APP_URL: https://testing.86chaos.com
      CHAOS_BASE_URL: https://testing.86chaos.com
      PLAYWRIGHT_BASE_URL: https://testing.86chaos.com
      CHAOS_EXPECTED_BRANCH: testing
      CHAOS_EXPECTED_VERCEL_PROJECT_SLUG: 86chaos
      REACT_APP_TEST_FIREBASE_PROJECT_ID: chaos-test-d1601
      FIREBASE_TEST_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT_KEY }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      SYSTEM_ADMIN_EMAIL: ${{ secrets.SYSTEM_ADMIN_EMAIL }}
      SYSTEM_ADMIN_PASSWORD: ${{ secrets.SYSTEM_ADMIN_PASSWORD }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      MANAGER_EMAIL: ${{ secrets.MANAGER_EMAIL }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
    steps:
      - name: Check out exact testing commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture exact testing identity
        shell: pwsh
        run: |
          $sha=(git rev-parse HEAD).Trim()
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          "CHAOS_EXPECTED_GIT_COMMIT=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAOS_EXPECTED_VERSION=$($pkg.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Verify source manifest parity
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const i=require('./scripts/86chaos-release-gate/source-identity.cjs');const a=i.captureSourceIdentity(process.cwd());const m=JSON.parse(fs.readFileSync('release-source-manifest.json','utf8'));if(a.sourceHash!==m.sourceHash)throw new Error('Tracked source does not match release-source-manifest.json');console.log('Source manifest verified:',a.sourceHash)"
      - name: Read reported mobile crash diagnostics
        shell: pwsh
        env:
          CHAOS_CRASH_REPORT_ID: qwifs3AdG2dJ8kqwmp40
        run: node scripts/read-crash-report-for-ci.cjs
      - name: Wait for exact testing deployment
        shell: pwsh
        run: |
          $matched=$false
          for($i=0;$i -lt 180;$i++){
            try{
              $s=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $v=Invoke-RestMethod "$env:APP_URL/version.json?ci=$s"
              $id=Invoke-RestMethod "$env:APP_URL/build-identity.json?ci=$s"
              $c=if($id.gitCommit){[string]$id.gitCommit}else{[string]$id.commit}
              if([string]$v.version -eq $env:CHAOS_EXPECTED_VERSION -and $c -eq $env:CHAOS_EXPECTED_GIT_COMMIT){$matched=$true;break}
            }catch{}
            Start-Sleep 10
          }
          if(-not $matched){throw "Timed out waiting for exact testing deployment."}
      - name: Run full Release Gate
        shell: pwsh
        run: npm run test:play-store
      - name: Upload Release Gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 86chaos-testing-full-release-gate
          if-no-files-found: warn
          retention-days: 30
          path: |
            test-results/**
            86chaos-release-gate-SLIM-UPLOAD-ME.zip
