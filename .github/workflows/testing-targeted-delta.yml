name: Prepare Firebase Admin 14 Lock

on:
  push:
    branches:
      - testing

permissions:
  contents: read

concurrency:
  group: prepare-firebase-admin-lock
  cancel-in-progress: true

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out testing
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact 17.0.36 Firebase Admin 14.5 lockfile
        shell: bash
        run: |
          npm pkg set version=17.0.36
          npm pkg set dependencies.firebase-admin=14.5.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false
          echo "LOCK_JSON_BEGIN"
          cat package-lock.json
          echo "LOCK_JSON_END"
